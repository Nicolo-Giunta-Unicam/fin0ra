      </div>
      <hr class="section-divider">
      <div class="sim-slider-row">
        <label><span>Variazione entrate mensili</span><span id="simIncomeVal">+0 €</span></label>
        <input type="range" id="simIncome" min="-500" max="1500" step="10" value="0">
      </div>
      <div class="sim-slider-row">
        <label><span>Variazione spese mensili</span><span id="simExpenseVal">+0 €</span></label>
        <input type="range" id="simExpense" min="-500" max="500" step="10" value="0">
      </div>
      <div class="sim-slider-row">
        <label><span>Versamento aggiuntivo al fondo scelto</span><span id="simFundVal">+0 €</span></label>
        <input type="range" id="simFundDelta" min="-200" max="500" step="10" value="0">
      </div>
      <div class="sim-result-box" id="simResultBox"></div>
      <button class="btn btn-primary" id="btnApplySim" style="margin-top:16px;">${ICONS.check} Applica questo versamento al fondo</button>
    </div>
    `}
  `;

  if(!fundsWithGoal.length){
    const goto = el.querySelector('[data-goto]');
    if(goto) goto.addEventListener('click', ()=>{ state.currentView='funds'; saveState(); renderAll(); });
    return;
  }

  const selectEl = document.getElementById('simFundSelect');
  const incomeEl = document.getElementById('simIncome');
  const expenseEl = document.getElementById('simExpense');
  const fundDeltaEl = document.getElementById('simFundDelta');

  function updateSim(){
    const fund = state.funds.find(f=> f.id===selectEl.value);
    const incomeDelta = parseFloat(incomeEl.value);
    const expenseDelta = parseFloat(expenseEl.value);
    const fundDelta = parseFloat(fundDeltaEl.value);

    document.getElementById('simIncomeVal').textContent = (incomeDelta>=0?'+':'') + fmtEUR(incomeDelta);
    document.getElementById('simExpenseVal').textContent = (expenseDelta>=0?'+':'') + fmtEUR(expenseDelta);
    document.getElementById('simFundVal').textContent = (fundDelta>=0?'+':'') + fmtEUR(fundDelta);

    const baseline = fundProjection(fund);
    const newMonthly = Math.max(0, (fund.monthlyContribution||0) + fundDelta);
    const simulatedFund = Object.assign({}, fund, {monthlyContribution:newMonthly});
    const simulatedProj = fundProjection(simulatedFund);

    const newIncome = monthlyIncomeTotal() + incomeDelta;
    const newExpenses = monthlyExpensesTotal() + expenseDelta;
    const newFundsTotal = monthlyFundsTotal() + fundDelta;
    const newAvail = newIncome - newFundsTotal - newExpenses;

    let comparisonHTML;
    if(simulatedProj.status==='done'){
      comparisonHTML = `<p class="headline">Con questi valori, l'obiettivo di "<b>${escapeHTML(fund.name)}</b>" sarebbe già raggiunto.</p>`;
    } else if(simulatedProj.status==='no-rate'){
      comparisonHTML = `<p class="headline">Con un versamento mensile pari a zero non è possibile stimare una data di raggiungimento.</p>`;
    } else {
      let deltaText;
      if(baseline.status==='ok'){
        const diffMonths = baseline.months - simulatedProj.months;
        if(Math.abs(diffMonths) >= 0.5){
          const faster = diffMonths > 0;
          deltaText = ` — <b class="${faster?'':'worse'}">${Math.abs(diffMonths).toFixed(1)} mesi ${faster?'prima':'dopo'}</b> rispetto ad oggi`;
        } else {
          deltaText = ' — nessuna variazione significativa rispetto ad oggi';
        }
      } else {
        deltaText = ' (oggi non è stimabile: nessun versamento impostato)';
      }
      comparisonHTML = `<p class="headline">Con queste modifiche raggiungeresti "<b>${escapeHTML(fund.name)}</b>" entro <b>${fmtDate(simulatedProj.date)}</b>${deltaText}.</p>`;
    }

    document.getElementById('simResultBox').innerHTML = `
      ${comparisonHTML}
      <div class="stat-row" style="margin-top:14px; margin-bottom:0;">
        <div class="stat-card" style="padding:12px 14px;"><div class="lbl">Nuove entrate/mese</div><div class="val" style="font-size:16px;">${fmtEUR(newIncome)}</div></div>
        <div class="stat-card" style="padding:12px 14px;"><div class="lbl">Nuove spese/mese</div><div class="val" style="font-size:16px;">${fmtEUR(newExpenses)}</div></div>
        <div class="stat-card" style="padding:12px 14px;"><div class="lbl">Nuovo disponibile/mese</div><div class="val ${newAvail<0?'danger':'accent'}" style="font-size:16px;">${fmtEUR(newAvail)}</div></div>
        <div class="stat-card" style="padding:12px 14px;"><div class="lbl">Nuovo versamento al fondo</div><div class="val" style="font-size:16px;">${fmtEUR(newMonthly)}</div></div>
      </div>
    `;
  }

  [selectEl, incomeEl, expenseEl, fundDeltaEl].forEach(elm=> elm.addEventListener('input', updateSim));
  updateSim();

  document.getElementById('btnApplySim').addEventListener('click', ()=>{
    const fund = state.funds.find(f=> f.id===selectEl.value);
    const fundDelta = parseFloat(fundDeltaEl.value);
    fund.monthlyContribution = Math.max(0, (fund.monthlyContribution||0) + fundDelta);
    saveState();
    showToast('Versamento mensile del fondo aggiornato.');
    renderAll();
  });
}

/* ======================================================================
   RENDER: PROFILE
   ====================================================================== */
function profileInitials(p){
  const f = (p.firstName||'').trim().charAt(0).toUpperCase();
  const l = (p.lastName||'').trim().charAt(0).toUpperCase();
  return (f+l) || '—';
}
function profileFullName(p){
  const n = [(p.firstName||'').trim(), (p.lastName||'').trim()].filter(Boolean).join(' ');
  return n || 'Nome non impostato';
}
function renderProfile(){
  const el = document.getElementById('view-profile');
  const p = state.profile || {};
  el.innerHTML = `
    <div class="topbar">
      <div><h1>Profilo</h1><p class="lede">I tuoi dati personali: restano salvati solo su questo dispositivo.</p></div>
    </div>
    <div class="chart-card" style="max-width:520px;">
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:22px;">
        <div class="profile-avatar" id="profileAvatar">${profileInitials(p)}</div>
        <div>
          <div style="font-weight:600; font-size:16px;" id="profileNamePreview">${escapeHTML(profileFullName(p))}</div>
          <div style="font-size:12.5px; color:var(--ink-faint);" id="profileEmailPreview">${p.email?escapeHTML(p.email):'Nessuna email impostata'}</div>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Nome</label><input type="text" id="fProfFirst" placeholder="Es. Marco" value="${escapeAttr(p.firstName||'')}"></div>
        <div class="field"><label>Cognome</label><input type="text" id="fProfLast" placeholder="Es. Rossi" value="${escapeAttr(p.lastName||'')}"></div>
      </div>
      <div class="field"><label>Email</label><input type="text" id="fProfEmail" placeholder="Es. marco.rossi@email.com" value="${escapeAttr(p.email||'')}"></div>
      <div class="field"><label>Obiettivo finanziario (opzionale)</label><input type="text" id="fProfGoal" placeholder="Es. Indipendenza finanziaria entro 45 anni" value="${escapeAttr(p.goal||'')}"></div>
      <button class="btn btn-primary" id="btnSaveProfile">${ICONS.check} Salva profilo</button>
      <div class="hint" style="margin-top:12px;">Questi dati restano solo nel tuo backup: l'app non li invia da nessuna parte.</div>
    </div>
  `;
  const firstEl = document.getElementById('fProfFirst');
  const lastEl = document.getElementById('fProfLast');
  const emailEl = document.getElementById('fProfEmail');
  const syncPreview = ()=>{
    document.getElementById('profileAvatar').textContent = profileInitials({firstName:firstEl.value, lastName:lastEl.value});
    document.getElementById('profileNamePreview').textContent = profileFullName({firstName:firstEl.value, lastName:lastEl.value});
    document.getElementById('profileEmailPreview').textContent = emailEl.value.trim() || 'Nessuna email impostata';
  };
  [firstEl, lastEl, emailEl].forEach(i=> i.addEventListener('input', syncPreview));
  document.getElementById('btnSaveProfile').addEventListener('click', ()=>{
    state.profile = {
      firstName: firstEl.value.trim(),
      lastName: lastEl.value.trim(),
      email: emailEl.value.trim(),
      goal: document.getElementById('fProfGoal').value.trim(),
    };
    saveState();
    showToast('Profilo salvato.');
  });

  document.getElementById('view-profile').insertAdjacentHTML('beforeend', `<div id="cloudCardWrap" style="max-width:520px; margin-top:18px;"></div>`);
  document.getElementById('cloudCardWrap').innerHTML = cloudCardHTML();
  bindCloudCardEvents();
}

function cloudCardHTML(){
  const cfg = cloudConfig;
  if(!cfg.webAppUrl){
    return `
    <div class="chart-card" style="margin-bottom:0;">
      <h3>${ICONS.cloud} Sincronizzazione cloud</h3>
      <p class="hint" style="margin:6px 0 14px;">Collega Fin0ra al tuo Google Sheet (via Apps Script) per avere gli stessi dati su più dispositivi. Vedi il file di istruzioni fornito per il setup.</p>
      <div class="field"><label>URL Web App di Google Apps Script</label><input type="text" id="fCloudUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <button class="btn btn-primary" id="btnSaveCloudUrl">Salva indirizzo</button>
    </div>`;
  }
  if(!cfg.token){
    return `
    <div class="chart-card" style="margin-bottom:0;">
      <h3>${ICONS.cloud} Sincronizzazione cloud</h3>
      <p class="hint" style="margin:6px 0 14px; word-break:break-all;">Collegato a: <span class="mono" style="font-size:11px;">${escapeHTML(cfg.webAppUrl)}</span> — <button class="iconOnly" id="btnChangeCloudUrl" style="border:0; display:inline-flex; vertical-align:middle;">${ICONS.edit}</button></p>
      <div class="field"><label>Username</label><input type="text" id="fCloudUser" placeholder="Es. marco"></div>
      <div class="field"><label>Password</label><input type="password" id="fCloudPass" placeholder="Minimo 4 caratteri"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="btnCloudLogin">Accedi</button>
        <button class="btn btn-ghost" id="btnCloudRegister">Registrati</button>
      </div>
      <div class="hint" style="margin-top:12px;">Il login sostituisce i dati locali con quelli salvati per quell'utente nel cloud. La registrazione carica invece sul cloud i dati che hai già su questo dispositivo.</div>
    </div>`;
  }
  return `
  <div class="chart-card" style="margin-bottom:0;">
    <h3>${ICONS.cloud} Sincronizzazione cloud</h3>
    <p style="font-size:13.5px; margin:6px 0 4px;">Connesso come <b>${escapeHTML(cfg.username)}</b></p>
    <p class="hint" id="cloudStatusText" style="margin-bottom:14px;">Non ancora sincronizzato in questa sessione.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-primary" id="btnCloudSyncNow">${ICONS.cloud} Sincronizza ora</button>
      <button class="btn btn-ghost" id="btnCloudPull">Carica dal cloud</button>
      <button class="btn btn-danger-ghost" id="btnCloudLogout">Disconnetti</button>
    </div>
  </div>`;
}

function bindCloudCardEvents(){
  const urlBtn = document.getElementById('btnSaveCloudUrl');
  if(urlBtn) urlBtn.addEventListener('click', ()=>{
    const url = document.getElementById('fCloudUrl').value.trim();
    if(!url){ showToast('Inserisci un URL valido.'); return; }
    cloudConfig = {webAppUrl:url, username:'', token:''};
    saveCloudConfig(cloudConfig);
    document.getElementById('cloudCardWrap').innerHTML = cloudCardHTML();
    bindCloudCardEvents();
  });

  const changeBtn = document.getElementById('btnChangeCloudUrl');
  if(changeBtn) changeBtn.addEventListener('click', ()=>{
    cloudConfig = {webAppUrl:'', username:'', token:''};
    saveCloudConfig(cloudConfig);
    document.getElementById('cloudCardWrap').innerHTML = cloudCardHTML();
    bindCloudCardEvents();
  });

  const loginBtn = document.getElementById('btnCloudLogin');
  if(loginBtn) loginBtn.addEventListener('click', async ()=>{
    const u = document.getElementById('fCloudUser').value.trim();
    const p = document.getElementById('fCloudPass').value;
    if(!u || !p){ showToast('Inserisci username e password.'); return; }
    loginBtn.disabled = true; loginBtn.textContent = 'Accesso in corso…';
    try{
      await cloudLogin(u,p);
      showToast('Accesso effettuato, dati sincronizzati.');
      renderAll();
    }catch(err){ showToast(err.message); loginBtn.disabled = false; loginBtn.textContent = 'Accedi'; }
  });

  const regBtn = document.getElementById('btnCloudRegister');
  if(regBtn) regBtn.addEventListener('click', async ()=>{
    const u = document.getElementById('fCloudUser').value.trim();
    const p = document.getElementById('fCloudPass').value;
    if(!u || p.length<4){ showToast('Username e password (minimo 4 caratteri) richiesti.'); return; }
    regBtn.disabled = true; regBtn.textContent = 'Registrazione…';
    try{
      await cloudRegister(u,p);
      showToast('Account creato e collegato.');
      renderAll();
    }catch(err){ showToast(err.message); regBtn.disabled = false; regBtn.textContent = 'Registrati'; }
  });

  const syncBtn = document.getElementById('btnCloudSyncNow');
  if(syncBtn) syncBtn.addEventListener('click', cloudPushNow);

  const pullBtn = document.getElementById('btnCloudPull');
  if(pullBtn) pullBtn.addEventListener('click', ()=>{
    confirmDialog('Caricare i dati dal cloud?','I dati locali su questo dispositivo verranno sostituiti con quelli salvati nel cloud.', cloudPullNow);
  });

  const logoutBtn = document.getElementById('btnCloudLogout');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{
    cloudLogout();
    document.getElementById('cloudCardWrap').innerHTML = cloudCardHTML();
    bindCloudCardEvents();
    showToast('Disconnesso. I dati restano comunque salvati in locale.');
  });

  updateCloudStatusUI();
}

/* ======================================================================
   MODAL / CONFIRM
   ====================================================================== */
function openModal({title, body, confirmLabel, onConfirm, wide, hideConfirm, extraClose}){
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  box.className = 'modal' + (wide?' wide':'');
  box.innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="iconOnly" id="modalClose" style="border:0;">${ICONS.x}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">${hideConfirm?'Chiudi':'Annulla'}</button>
      ${hideConfirm?'':`<button class="btn btn-primary" id="modalConfirm">${confirmLabel||'Conferma'}</button>`}
    </div>
  `;
  overlay.classList.add('active');
  const close = ()=> overlay.classList.remove('active');
  document.getElementById('modalClose').addEventListener('click', close);
  document.getElementById('modalCancel').addEventListener('click', close);
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  if(!hideConfirm){
    document.getElementById('modalConfirm').addEventListener('click', ()=>{
      const res = onConfirm ? onConfirm() : undefined;
      if(res !== false) close();
    });
  }
}
function confirmDialog(title, desc, onYes){
  openModal({
    title, body:`<p style="font-size:13.5px;color:var(--ink-soft);margin:0;">${desc}</p>`,
    confirmLabel:'Sì, elimina',
    onConfirm: onYes
  });
  const btn = document.getElementById('modalConfirm');
  if(btn){ btn.classList.remove('btn-primary'); btn.classList.add('btn-danger-ghost'); btn.style.borderColor='var(--danger)'; }
}

/* ======================================================================
   UTIL: escaping
   ====================================================================== */
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHTML(s); }

/* ======================================================================
   THEME
   ====================================================================== */
const THEME_DEFS = [
  {id:'light',         label:'Chiaro',           bg:'#F3F0E8', accent:'#1F6F54'},
  {id:'dark',          label:'Scuro',            bg:'#131E19', accent:'#49AC8B'},
  {id:'nightowl-light',label:'Night Owl Chiaro', bg:'#EAF3F8', accent:'#0E7A96'},
  {id:'nightowl',      label:'Night Owl',        bg:'#0B1521', accent:'#0E7A96'},
];
function themeSwatchHTML(t, active){
  return `<button class="theme-sw ${active?'active':''}" data-theme-opt="${t.id}" title="${t.label}" style="background:linear-gradient(135deg, ${t.bg} 50%, ${t.accent} 50%)"><span class="check">${ICONS.check}</span></button>`;
}
function renderThemeSwatches(containerId, closeAfter){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = THEME_DEFS.map(t=> themeSwatchHTML(t, state.theme===t.id)).join('');
  el.querySelectorAll('[data-theme-opt]').forEach(btn=> btn.addEventListener('click', ()=>{
    setTheme(btn.dataset.themeOpt);
    if(closeAfter) document.getElementById('modalOverlay').classList.remove('active');
  }));
}
function openThemeModal(){
  openModal({ title:'Scegli tema', hideConfirm:true, body:`<div class="theme-swatches" id="themeSwatchesModal" style="justify-content:center; gap:16px;"></div>` });
  renderThemeSwatches('themeSwatchesModal', true);
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  renderThemeSwatches('themeSwatchesDesktop', false);
}
function setTheme(id){
  state.theme = id;
  saveState(); applyTheme();
  // re-render active charts with new theme colors
  renderAll();
}

/* ======================================================================
   EXPORT / IMPORT
   ====================================================================== */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fin0ra-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup esportato.');
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('formato non valido');
      confirmDialog('Importare questo backup?','I dati attuali verranno sostituiti con quelli del file.', ()=>{
        state = Object.assign(defaultState(), parsed);
        saveState(); applyTheme(); renderAll(); showToast('Backup importato.');
      });
      const btn = document.getElementById('modalConfirm');
      if(btn){ btn.classList.remove('btn-danger-ghost'); btn.classList.add('btn-primary'); btn.style.borderColor=''; }
    }catch(e){ showToast('File non valido.'); }
  };
  reader.readAsText(file);
}

/* ======================================================================
   MAIN RENDER
   ====================================================================== */
function renderAll(){
  renderNav();
  document.querySelectorAll('.view').forEach(v=> v.classList.toggle('active', v.dataset.view===state.currentView));
  if(state.currentView==='dashboard') renderDashboard();
  else if(state.currentView==='accounts') renderAccounts();
  else if(state.currentView==='income') renderIncome();
  else if(state.currentView==='expenses') renderExpenses();
  else if(state.currentView==='funds') renderFunds();
  else if(state.currentView==='assets') renderAssets();
  else if(state.currentView==='debts') renderDebts();
  else if(state.currentView==='simulator') renderSimulator();
  else if(state.currentView==='profile') renderProfile();
}

document.getElementById('btnExport').addEventListener('click', exportData);
document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(file) importData(file); e.target.value='';
});
document.getElementById('themeToggleMobile').addEventListener('click', openThemeModal);

applyTheme();
renderAll();

// Registrazione del service worker per l'installazione come app (PWA).
// Funziona solo se il file è servito via http/https (es. GitHub Pages),
// non quando è aperto direttamente dal disco (file://).
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
