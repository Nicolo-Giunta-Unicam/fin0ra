<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fin0ra · Patrimonio &amp; Fondi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F6F54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fin0ra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F3F0E8; --bg-elevated:#FFFFFF; --bg-sunken:#EAE5D8;
  --ink:#1B2620; --ink-soft:#5B665E; --ink-faint:#8B9289;
  --border:#DDD7C8; --border-soft:#E9E4D8;
  --accent:#1F6F54; --accent-soft:#DFEAE4; --accent-strong:#153F30;
  --brass:#B07F2E; --brass-soft:#F3E6CC;
  --danger:#B54A3E; --danger-soft:#F3DEDA;
  --shadow: 0 1px 2px rgba(27,38,32,.04), 0 6px 20px -8px rgba(27,38,32,.12);
  --radius-s:8px; --radius-m:14px; --radius-l:20px;
  --font-display:'Fraunces', serif; --font-body:'IBM Plex Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
html[data-theme="dark"]{
  --bg:#131E19; --bg-elevated:#1B2822; --bg-sunken:#0F1713;
  --ink:#ECE8DD; --ink-soft:#A7B0A7; --ink-faint:#6C776E;
  --border:#2B3A32; --border-soft:#22302A;
  --accent:#49AC8B; --accent-soft:#1E332B; --accent-strong:#8FD9BE;
  --brass:#D7A756; --brass-soft:#332911;
  --danger:#E08476; --danger-soft:#3A211D;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px -10px rgba(0,0,0,.5);
}
html[data-theme="nightowl-light"]{
  --bg:#EAF3F8; --bg-elevated:#FFFFFF; --bg-sunken:#DCEAF1;
  --ink:#132434; --ink-soft:#4B6478; --ink-faint:#7E93A4;
  --border:#C7DCE6; --border-soft:#DCEAF1;
  --accent:#0E7A96; --accent-soft:#D2ECF3; --accent-strong:#0B5A70;
  --brass:#A67623; --brass-soft:#F3E6C4;
  --danger:#C1483C; --danger-soft:#F3DAD5;
  --shadow: 0 1px 2px rgba(19,36,52,.05), 0 6px 20px -8px rgba(19,36,52,.14);
}
html[data-theme="nightowl"]{
  --bg:#0B1521; --bg-elevated:#122236; --bg-sunken:#08101A;
  --ink:#D6E2F0; --ink-soft:#8CA3BF; --ink-faint:#556B85;
  --border:#1E3350; --border-soft:#182B44;
  --accent:#0E7A96; --accent-soft:#123246; --accent-strong:#2E9CC2;
  --brass:#F2B84B; --brass-soft:#3A2C12;
  --danger:#F2776B; --danger-soft:#3A1C18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
body{margin:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; transition:background .25s ease,color .25s ease;
}
h1,h2,h3,.num-display{font-family:var(--font-display);}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
::selection{background:var(--accent); color:#fff;}
a{color:inherit;}

/* ============ LAYOUT ============ */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex:0 0 230px; background:var(--bg-elevated); border-right:1px solid var(--border);
  padding:24px 16px; display:flex; flex-direction:column; gap:28px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));
  display:flex;align-items:center;justify-content:center; color:#fff; font-family:var(--font-display); font-weight:600; font-size:17px; flex:none;
}
.brand-word{font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:.2px;}
.brand-zero{color:var(--accent); font-style:italic;}
.brand-sub{font-size:10.5px; color:var(--ink-faint); letter-spacing:.14em; text-transform:uppercase; margin-top:1px;}

nav.mainnav{display:flex; flex-direction:column; gap:2px;}
.navbtn{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; border:0; background:transparent;
  color:var(--ink-soft); font-size:14.5px; font-weight:500; text-align:left; cursor:pointer; position:relative;
  border-left:3px solid transparent;
}
.navbtn svg{width:18px;height:18px; flex:none;}
.navbtn:hover{background:var(--bg-sunken); color:var(--ink);}
.navbtn.active{background:var(--accent-soft); color:var(--accent-strong); border-left:3px solid var(--accent); font-weight:600;}
html[data-theme="dark"] .navbtn.active{color:var(--accent-strong);}

.sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px;}
.iconbtn-row{display:flex; gap:8px;}
.iconbtn{
  display:flex; align-items:center; justify-content:center; gap:6px; flex:1; padding:8px; border-radius:9px;
  border:1px solid var(--border); background:var(--bg); color:var(--ink-soft); cursor:pointer; font-size:12px; font-weight:500;
}
.iconbtn:hover{background:var(--bg-sunken); color:var(--ink);}
.iconbtn svg{width:15px;height:15px;}

.theme-picker{padding:10px 10px 11px; border-radius:10px; border:1px solid var(--border); background:var(--bg);}
.theme-picker-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; margin-bottom:9px;}
.theme-swatches{display:flex; gap:9px; justify-content:space-between;}
.theme-sw{width:28px;height:28px;border-radius:50%; border:2px solid var(--border-soft); cursor:pointer; padding:0; position:relative; flex:none;}
.theme-sw.active{border-color:var(--ink); box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--ink);}
.theme-sw .check{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; opacity:0;}
.theme-sw.active .check{opacity:1;}
.theme-sw .check svg{width:12px;height:12px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}

main{flex:1; min-width:0; padding:32px 40px 80px;}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:14px;}
.topbar h1{font-size:28px; margin:0 0 4px; font-weight:600;}
.topbar .lede{color:var(--ink-soft); font-size:14px; margin:0;}
.view{display:none;}
.view.active{display:block; animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:10px 16px; border-radius:10px; border:1px solid transparent;
  font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-ghost:hover{background:var(--bg-sunken);}
.btn-danger-ghost{background:transparent; border-color:var(--border); color:var(--danger);}
.btn-danger-ghost:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.iconOnly{padding:7px; border-radius:8px; background:transparent; border:1px solid var(--border); color:var(--ink-soft); cursor:pointer; display:inline-flex;}
.iconOnly svg{width:14px;height:14px;}
.iconOnly:hover{background:var(--bg-sunken); color:var(--ink);}

/* ============ STAT / SUMMARY CARDS ============ */
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px;}
.stat-card{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-m); padding:18px 20px;
  box-shadow:var(--shadow);
}
.stat-card .lbl{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; margin-bottom:8px;}
.stat-card .val{font-size:24px; font-weight:600; font-family:var(--font-mono);}
.stat-card .val.accent{color:var(--accent);}
.stat-card .val.danger{color:var(--danger);}
.stat-card .sub{font-size:12px; color:var(--ink-faint); margin-top:4px;}

.hero-total{
  background:linear-gradient(160deg, var(--accent-strong), var(--accent));
  border-radius:var(--radius-l); padding:28px 30px; color:#fff; position:relative; overflow:hidden; margin-bottom:22px;
  box-shadow:var(--shadow);
}
.hero-total::before{
  content:''; position:absolute; inset:0;
  background-image:repeating-linear-gradient(rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 1px, transparent 26px);
  pointer-events:none;
}
.hero-total .lbl{font-size:12px; text-transform:uppercase; letter-spacing:.1em; opacity:.8; font-weight:600; position:relative;}
.hero-total .figure{font-family:var(--font-display); font-size:44px; font-weight:600; margin:6px 0 2px; position:relative;}
.hero-total .sub{font-size:13px; opacity:.85; position:relative;}
.hero-net{
  position:relative; margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,.22);
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.hero-net span:first-child{font-size:12px; opacity:.85;}
.hero-net span:last-child{font-size:18px; font-weight:600;}

.chart-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-m); padding:20px 22px; margin-bottom:26px; box-shadow:var(--shadow);}
.chart-card h3{margin:0 0 14px; font-size:15px; font-weight:600;}
.chart-wrap{position:relative; height:220px;}
.chart-wrap.tall{height:280px;}

/* ============ GRID / CARDS ============ */
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.section-head h2{font-size:19px; margin:0; font-weight:600;}
.section-head .meta{font-size:13px; color:var(--ink-soft);}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px;}

.acct-card{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-m); padding:0; cursor:pointer;
  box-shadow:var(--shadow); overflow:hidden; position:relative; transition:transform .15s ease, box-shadow .15s ease;
}
.acct-card:hover{transform:translateY(-2px);}
.acct-stripe{height:5px; width:100%;}
.acct-body{padding:16px 18px 18px;}
.acct-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.acct-icon{width:34px;height:34px;border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff;}
.acct-icon svg{width:17px;height:17px;}
.acct-name{font-weight:600; font-size:14.5px; line-height:1.2;}
.acct-type{font-size:11.5px; color:var(--ink-faint);}
.acct-bal{font-family:var(--font-mono); font-size:22px; font-weight:600; margin-bottom:2px;}
.acct-delta{font-size:12px; font-weight:500; display:flex; align-items:center; gap:4px;}
.acct-delta.up{color:var(--accent);}
.acct-delta.down{color:var(--danger);}
.acct-delta svg{width:12px;height:12px;}
.acct-actions{position:absolute; top:14px; right:14px; display:flex; gap:5px; opacity:0; transition:opacity .15s ease;}
.acct-card:hover .acct-actions{opacity:1;}
.acct-actions .iconOnly{background:rgba(255,255,255,.85); backdrop-filter:blur(2px);}
html[data-theme="dark"] .acct-actions .iconOnly, html[data-theme="nightowl"] .acct-actions .iconOnly{background:rgba(20,30,26,.75);}

.empty-state{
  border:1.5px dashed var(--border); border-radius:var(--radius-m); padding:44px 24px; text-align:center; color:var(--ink-soft);
}
.empty-state svg{width:34px;height:34px; color:var(--ink-faint); margin-bottom:10px;}
.empty-state .t{font-weight:600; color:var(--ink); margin-bottom:4px; font-size:15px;}
.empty-state .d{font-size:13px; max-width:340px; margin:0 auto 14px;}

/* ============ TABLE (income) ============ */
.tbl{width:100%; border-collapse:collapse; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-m); overflow:hidden; box-shadow:var(--shadow);}
.tbl thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; padding:12px 16px; background:var(--bg-sunken); border-bottom:1px solid var(--border);}
.tbl tbody td{padding:13px 16px; font-size:14px; border-bottom:1px solid var(--border-soft);}
.tbl tbody tr:last-child td{border-bottom:0;}
.tbl tbody tr:hover{background:var(--bg-sunken);}
.badge{display:inline-flex; align-items:center; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600;}
.badge.blue{background:var(--accent-soft); color:var(--accent-strong);}
.badge.brass{background:var(--brass-soft); color:var(--brass);}
.badge.grey{background:var(--bg-sunken); color:var(--ink-soft); border:1px solid var(--border);}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}

.cat-chip{display:flex; align-items:center; gap:9px;}
.cat-chip .ic{width:28px;height:28px;border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; flex:none;}
.cat-chip .ic svg{width:14px;height:14px;}
.cat-chip .lbl{font-weight:500;}
.cat-chip .sub{font-size:11px; color:var(--ink-faint);}

.legend-list{display:flex; flex-direction:column; gap:9px; margin-top:6px;}
.legend-row{display:flex; align-items:center; gap:10px; font-size:13px;}
.legend-row .dot{width:10px;height:10px;border-radius:3px; flex:none;}
.legend-row .n{flex:1; min-width:0;}
.legend-row .p{color:var(--ink-faint); font-family:var(--font-mono); font-size:12px; width:42px; text-align:right;}
.legend-row .a{font-family:var(--font-mono); font-weight:600; width:88px; text-align:right;}
.pie-layout{display:grid; grid-template-columns:200px 1fr; gap:28px; align-items:center;}
@media (max-width:640px){ .pie-layout{grid-template-columns:1fr;} }
.two-charts{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:860px){ .two-charts{grid-template-columns:1fr;} }

.expense-group{margin-bottom:18px;}
.expense-group-head{display:flex; align-items:center; gap:9px; padding:0 2px; margin-bottom:8px;}
.expense-group-head .dot{width:9px;height:9px;border-radius:3px; flex:none;}
.expense-group-head .name{font-weight:600; font-size:14px;}
.expense-group-head .count{font-size:12px; color:var(--ink-faint); flex:1;}
.expense-group-head .subtotal{font-size:13px; font-weight:600; color:var(--ink-soft);}

/* ============ FUNDS ============ */
.fund-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-m); padding:18px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;}
.fund-top{display:flex; align-items:center; gap:12px;}
.fund-icon{width:40px;height:40px;border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff;}
.fund-icon svg{width:19px;height:19px;}
.fund-name{font-weight:600; font-size:15px;}
.fund-note{font-size:11.5px; color:var(--ink-faint);}
.fund-mid{display:flex; align-items:center; gap:16px;}
.ring{width:68px;height:68px;border-radius:50%; position:relative; flex:none; display:flex; align-items:center; justify-content:center;}
.ring .hole{position:absolute; inset:7px; background:var(--bg-elevated); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column;}
.ring .pct{font-family:var(--font-mono); font-size:13px; font-weight:600;}
.fund-figs{flex:1;}
.fund-figs .amt{font-family:var(--font-mono); font-size:19px; font-weight:600;}
.fund-figs .goal{font-size:12px; color:var(--ink-faint);}
.fund-bottom{display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border-soft); padding-top:12px;}
.fund-monthly{font-size:12.5px; color:var(--ink-soft);}
.fund-monthly b{color:var(--ink); font-family:var(--font-mono);}
.fund-actions{display:flex; gap:6px;}
.fund-proj{display:flex; flex-direction:column; gap:5px; background:var(--bg-sunken); border-radius:10px; padding:10px 12px;}
.fund-proj-line{font-size:12px; color:var(--ink-soft); line-height:1.5; display:flex; align-items:center; gap:6px;}
.fund-proj-line svg{width:13px;height:13px; flex:none;}
.fund-proj-line b{color:var(--ink); font-family:var(--font-mono); font-weight:600;}
.fund-proj-line.done{color:var(--accent); font-weight:600;}
.fund-proj-line.muted{color:var(--ink-faint); font-style:italic;}
.fund-proj-line.danger{color:var(--danger);}
.fund-proj-line .tag-ok{color:var(--accent); font-weight:600;}
.fund-proj-line .tag-bad{color:var(--danger); font-weight:600;}

/* Allocazioni investimento */
.alloc-bar{display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--border-soft); margin-top:8px;}
.alloc-seg{height:100%;}
.alloc-list{margin-top:10px; display:flex; flex-direction:column; gap:7px; max-height:150px; overflow-y:auto;}
.alloc-row{display:flex; align-items:center; gap:9px; font-size:12.5px;}
.alloc-row .dot{width:9px;height:9px;border-radius:50%; flex:none;}
.alloc-row .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.alloc-row .p{color:var(--ink-faint); width:36px; text-align:right; font-family:var(--font-mono); font-size:11.5px;}
.alloc-row .a{width:84px; text-align:right; font-family:var(--font-mono); font-weight:600;}

.deposit-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:6px;}
.deposit-stat{background:var(--bg-sunken); border-radius:10px; padding:11px 13px;}
.deposit-stat .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:600; margin-bottom:5px;}
.deposit-stat .val{font-size:15.5px; font-weight:600; font-family:var(--font-mono);}
.section-divider{border:0; border-top:1px solid var(--border-soft); margin:18px 0;}
.hint.accent{color:var(--accent);}
.hint.danger{color:var(--danger);}
.profile-avatar{width:52px;height:52px;border-radius:50%; background:linear-gradient(155deg,var(--accent),var(--accent-strong)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:18px; flex:none;}
.insight-list{display:flex; flex-direction:column; gap:9px;}
.insight-row{display:flex; align-items:flex-start; gap:12px; padding:11px 14px; border-radius:10px; background:var(--bg-sunken);}
.insight-row .ic{width:28px;height:28px;border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px;}
.insight-row .ic svg{width:14px;height:14px;}
.insight-row.positive .ic{background:var(--accent-soft); color:var(--accent-strong);}
.insight-row.warning .ic{background:var(--danger-soft); color:var(--danger);}
.insight-row.info .ic{background:var(--brass-soft); color:var(--brass);}
.insight-row p{margin:0; font-size:13px; color:var(--ink); line-height:1.5; padding-top:4px;}

.sim-slider-row{margin-bottom:20px;}
.sim-slider-row label{display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:8px;}
.sim-slider-row label span:last-child{font-family:var(--font-mono); font-weight:600; color:var(--ink); font-size:14px;}
.sim-slider-row input[type=range]{
  width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:99px; background:var(--border); outline:none; cursor:pointer;
}
.sim-slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent);
  border:3px solid var(--bg-elevated); box-shadow:0 1px 3px rgba(0,0,0,.3); cursor:pointer;
}
.sim-slider-row input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid var(--bg-elevated); box-shadow:0 1px 3px rgba(0,0,0,.3); cursor:pointer;
}
.sim-result-box{background:var(--bg-sunken); border-radius:12px; padding:18px 20px; margin-top:6px;}
.sim-result-box .headline{font-size:14.5px; line-height:1.6;}
.sim-result-box .headline b{font-family:var(--font-mono); color:var(--accent);}
.sim-result-box .headline b.worse{color:var(--danger);}
.chart-card h3{display:flex; align-items:center; gap:8px;}
.chart-card h3 svg{width:16px;height:16px; color:var(--accent);}

/* ============ MODAL ============ */
.modal-overlay{position:fixed; inset:0; background:rgba(15,20,17,.5); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:6vh 16px; z-index:100; overflow-y:auto;}
.modal-overlay.active{display:flex;}
.modal{background:var(--bg-elevated); border-radius:var(--radius-l); width:100%; max-width:460px; box-shadow:0 30px 60px -12px rgba(0,0,0,.35); border:1px solid var(--border); animation:pop .2s ease;}
.modal.wide{max-width:640px;}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px 0;}
.modal-head h3{margin:0; font-size:17px; font-weight:600;}
.modal-body{padding:16px 22px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:0 22px 22px;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg);
  color:var(--ink); font-size:14px; font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.chk-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
.chk-row input{width:auto;}

.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:50%; cursor:pointer; border:2px solid transparent;}
.swatch.selected{border-color:var(--ink);}
.icon-picker{display:flex; gap:8px; flex-wrap:wrap;}
.icon-opt{width:38px;height:38px;border-radius:10px; border:1px solid var(--border); background:var(--bg); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
.icon-opt svg{width:17px;height:17px;}
.icon-opt.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}

.entry-list{max-height:180px; overflow-y:auto; border:1px solid var(--border-soft); border-radius:10px; margin-top:6px;}
.entry-row{display:flex; align-items:center; justify-content:space-between; padding:9px 12px; font-size:13px; border-bottom:1px solid var(--border-soft);}
.entry-row:last-child{border-bottom:0;}
.entry-row .d{color:var(--ink-soft);}
.entry-row .a{font-family:var(--font-mono); font-weight:600;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:99px; font-size:13px; font-weight:500; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.mobile-topbar{display:none;}

.mobile-bottom-nav{display:none;}
@media (max-width:860px){
  #app{flex-direction:column;}
  .sidebar{display:none;}
  .mobile-bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--bg-elevated);
    border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:50; justify-content:space-around; align-items:stretch;
  }
  .mobile-bottom-nav .navbtn{
    flex-direction:column; gap:3px; font-size:10px; border-left:0; border-top:3px solid transparent;
    padding:6px 4px; border-radius:8px; flex:1; min-width:0; align-items:center;
  }
  .mobile-bottom-nav .navbtn span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .mobile-bottom-nav .navbtn.active{border-top:3px solid var(--accent); border-left:0; background:transparent; color:var(--accent-strong);}
  main{padding:20px 16px 96px;}
  .mobile-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .mobile-topbar .brand-word{font-size:17px;}
  .field-row{grid-template-columns:1fr;}
}
.more-menu-list{display:flex; flex-direction:column; gap:7px;}
.more-menu-item{
  display:flex; align-items:center; gap:13px; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); font-size:14px; font-weight:500; color:var(--ink); cursor:pointer; text-align:left; width:100%;
}
.more-menu-item svg{width:18px;height:18px; flex:none; color:var(--ink-soft);}
.more-menu-item:hover{background:var(--bg-sunken);}
.more-menu-item.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
.more-menu-item.active svg{color:var(--accent-strong);}
</style>

const STORAGE_KEY = 'fin0ra_state_v1';
let state = loadState();

function defaultState(){
  return { theme:'light', accounts:[], incomes:[], expenses:[], funds:[], assets:[], debts:[], customCategories:[], profile:{firstName:'',lastName:'',email:'',goal:''}, currentView:'dashboard' };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast('Impossibile salvare i dati in questo browser.'); }
  scheduleCloudPush();
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ======================================================================
   SINCRONIZZAZIONE CLOUD (Google Sheet + Apps Script, opzionale)
   ====================================================================== */
const CLOUD_KEY = 'fin0ra_cloud_v1';
function loadCloudConfig(){
  try{
    const raw = localStorage.getItem(CLOUD_KEY);
    return raw ? JSON.parse(raw) : {webAppUrl:'', username:'', token:''};
  }catch(e){ return {webAppUrl:'', username:'', token:''}; }
}
function saveCloudConfig(cfg){
  try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg)); }catch(e){}
}
let cloudConfig = loadCloudConfig();
let cloudSyncTimer = null;
let cloudLastSync = null;
let cloudSyncing = false;

function cloudIsLinked(){ return !!(cloudConfig.webAppUrl && cloudConfig.username && cloudConfig.token); }

async function cloudRequest(action, payload){
  if(!cloudConfig.webAppUrl) throw new Error('URL non configurato.');
  const res = await fetch(cloudConfig.webAppUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita il preflight CORS su Apps Script
    body: JSON.stringify(Object.assign({action}, payload))
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Errore sconosciuto dal server.');
  return json;
}

async function cloudRegister(username, password){
  const res = await cloudRequest('register', {username, password, data: state});
  cloudConfig = {webAppUrl: cloudConfig.webAppUrl, username: res.username, token: res.token};
  saveCloudConfig(cloudConfig);
  cloudLastSync = new Date();
  return res;
}

async function cloudLogin(username, password){
  const res = await cloudRequest('login', {username, password});
  cloudConfig = {webAppUrl: cloudConfig.webAppUrl, username: res.username, token: res.token};
  saveCloudConfig(cloudConfig);
  if(res.data && Object.keys(res.data).length){
    state = Object.assign(defaultState(), res.data);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  cloudLastSync = new Date();
  return res;
}

function cloudLogout(){
  cloudConfig = {webAppUrl: cloudConfig.webAppUrl, username:'', token:''};
  saveCloudConfig(cloudConfig);
}

async function cloudPushNow(){
  if(!cloudIsLinked()) return;
  cloudSyncing = true; updateCloudStatusUI();
  try{
    await cloudRequest('save', {username:cloudConfig.username, token:cloudConfig.token, data: state});
    cloudLastSync = new Date();
  }catch(err){
    showToast('Sincronizzazione non riuscita: dati salvati solo in locale.');
  }
  cloudSyncing = false; updateCloudStatusUI();
}

async function cloudPullNow(){
  if(!cloudIsLinked()) return;
  cloudSyncing = true; updateCloudStatusUI();
  try{
    const res = await cloudRequest('load', {username:cloudConfig.username, token:cloudConfig.token});
    state = Object.assign(defaultState(), res.data);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    cloudLastSync = new Date();
    renderAll();
    showToast('Dati aggiornati dal cloud.');
  }catch(err){
    showToast('Impossibile caricare dal cloud: ' + err.message);
  }
  cloudSyncing = false; updateCloudStatusUI();
}

function scheduleCloudPush(){
  if(!cloudIsLinked()) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(cloudPushNow, 3000);
}

function updateCloudStatusUI(){
  const el = document.getElementById('cloudStatusText');
  if(!el) return;
  if(cloudSyncing){ el.textContent = 'Sincronizzazione in corso…'; return; }
  el.textContent = cloudLastSync
    ? 'Ultima sincronizzazione: ' + cloudLastSync.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})
    : 'Non ancora sincronizzato in questa sessione.';
}

function fmtEUR(n){
  n = Number(n)||0;
  return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n);
}
function fmtDate(d){
  return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T00:00:00'));
}
function fmtDateShort(d){
  return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short'}).format(new Date(d+'T00:00:00'));
}
function accountTypeInfo(t){ return ACCOUNT_TYPES.find(x=>x.id===t) || ACCOUNT_TYPES[5]; }
function sortedEntries(acc){ return [...acc.entries].sort((a,b)=> a.date.localeCompare(b.date)); }
function lastBalance(acc){
  const e = sortedEntries(acc);
  return e.length ? e[e.length-1].amount : 0;
}
function prevBalance(acc){
  const e = sortedEntries(acc);
  return e.length>1 ? e[e.length-2].amount : null;
}
function totalPatrimonio(){
  return state.accounts.reduce((s,a)=> s + lastBalance(a), 0);
}
function monthlyIncomeTotal(){
  return state.incomes.reduce((s,i)=> s + (i.frequency==='annual' ? i.amount/12 : i.amount), 0);
}
function monthlyFundsTotal(){
  return state.funds.reduce((s,f)=> s + (f.monthlyContribution||0), 0);
}
function allCategories(){ return [...EXPENSE_CATEGORIES, ...(state.customCategories||[])]; }
function categoryInfo(id){ return allCategories().find(c=>c.id===id) || EXPENSE_CATEGORIES[EXPENSE_CATEGORIES.length-1]; }
function freqLabel(id){ return (FREQ_OPTIONS.find(f=>f.id===id)||{}).label || id; }
function expenseMonthlyEquivalent(exp){
  let days;
  if(exp.frequency === 'custom'){
    const unitDays = exp.customUnit==='days' ? 1 : exp.customUnit==='weeks' ? 7 : 30.44;
    days = Math.max(1, (exp.customInterval||1)) * unitDays;
  } else {
    const f = FREQ_OPTIONS.find(x=>x.id===exp.frequency);
    days = f ? f.days : 30.44;
  }
  const occurrencesPerMonth = 30.44 / days;
  return (exp.amount||0) * occurrencesPerMonth;
}
function monthlyExpensesTotal(){
  return state.expenses.reduce((s,e)=> s + expenseMonthlyEquivalent(e), 0);
}
function expensesByCategory(){
  const map = {};
  state.expenses.forEach(e=>{
    map[e.category] = (map[e.category]||0) + expenseMonthlyEquivalent(e);
  });
  return Object.entries(map)
    .map(([catId, monthly])=> ({ cat: categoryInfo(catId), monthly }))
    .sort((a,b)=> b.monthly - a.monthly);
}
function expensesByGroup(){
  const map = {};
  state.expenses.forEach(e=>{
    const g = categoryInfo(e.category).group;
    map[g] = (map[g]||0) + expenseMonthlyEquivalent(e);
  });
  return GROUP_ORDER.filter(g=> map[g])
    .map(g=> ({ group:g, color:GROUP_COLORS[g], monthly:map[g] }))
    .sort((a,b)=> b.monthly - a.monthly);
}
function expensesGroupedForList(){
  return GROUP_ORDER.map(g=>{
    const items = state.expenses
      .filter(e=> categoryInfo(e.category).group === g)
      .sort((a,b)=> expenseMonthlyEquivalent(b) - expenseMonthlyEquivalent(a));
    const subtotal = items.reduce((s,e)=> s + expenseMonthlyEquivalent(e), 0);
    return { group:g, color:GROUP_COLORS[g], items, subtotal };
  }).filter(x=> x.items.length > 0);
}
function monthlyAvailable(){
  return monthlyIncomeTotal() - monthlyFundsTotal() - monthlyExpensesTotal();
}
function fundsAllocatedTotal(){
  return state.funds.reduce((s,f)=> s + (f.currentAmount||0), 0);
}
function unallocated(){
  return totalPatrimonio() - fundsAllocatedTotal();
}
function daysBetweenISO(iso1, iso2){
  return (new Date(iso2+'T00:00:00') - new Date(iso1+'T00:00:00')) / 86400000;
}
function monthsBetweenISO(iso1, iso2){ return daysBetweenISO(iso1, iso2) / 30.44; }
function addMonthsISO(iso, monthsFloat){
  const d = new Date(iso+'T00:00:00');
  const whole = Math.floor(monthsFloat);
  const frac = monthsFloat - whole;
  d.setMonth(d.getMonth() + whole);
  d.setDate(d.getDate() + Math.round(frac*30.44));
  return d.toISOString().slice(0,10);
}
/* Proiezione al ritmo di versamento attuale */
function fundProjection(f){
  if(!f.goal) return {status:'no-goal'};
  const remaining = f.goal - f.currentAmount;
  if(remaining <= 0) return {status:'done'};
  if(!f.monthlyContribution || f.monthlyContribution <= 0) return {status:'no-rate'};
  const months = remaining / f.monthlyContribution;
  return {status:'ok', months, date: addMonthsISO(todayISO(), months)};
}
/* Versamento mensile consigliato per centrare una data obiettivo */
function fundRecommended(f){
  if(!f.goal || !f.targetDate) return {status:'none'};
  const remaining = f.goal - f.currentAmount;
  if(remaining <= 0) return {status:'done'};
  const months = monthsBetweenISO(todayISO(), f.targetDate);
  if(months <= 0.03) return {status:'overdue'};
  return {status:'ok', amount: remaining/months, months};
}
function estimateMaturityValue(acc){
  if(!acc.maturity || !acc.rate) return null;
  const bal = lastBalance(acc);
  const years = Math.max(0, daysBetweenISO(todayISO(), acc.maturity) / 365.25);
  return bal * Math.pow(1 + (acc.rate/100), years);
}
function allocationTotal(acc){ return (acc.allocations||[]).reduce((s,a)=> s + a.amount, 0); }
function formatReturn(acc){
  if(acc.returnValue == null || isNaN(acc.returnValue)) return null;
  const sign = acc.returnValue >= 0 ? '+' : '';
  return acc.returnType === 'amount' ? `${sign}${fmtEUR(acc.returnValue)}` : `${sign}${acc.returnValue.toLocaleString('it-IT')}%`;
}
/* Beni mobili e immobili */
function assetTypeInfo(id){ return ASSET_TYPES.find(t=>t.id===id) || ASSET_TYPES[2]; }
function assetGain(a){ return (a.currentValue||0) - (a.purchaseValue||0); }
function assetGainPct(a){ return a.purchaseValue ? (assetGain(a)/a.purchaseValue*100) : null; }
function totalAssetsValue(){ return state.assets.reduce((s,a)=> s + (a.currentValue||0), 0); }
function totalAssetsPurchase(){ return state.assets.reduce((s,a)=> s + (a.purchaseValue||0), 0); }
function totalAssetsGain(){ return totalAssetsValue() - totalAssetsPurchase(); }
/* Debiti */
function debtTypeInfo(id){ return DEBT_TYPES.find(t=>t.id===id) || DEBT_TYPES[DEBT_TYPES.length-1]; }
function debtProjection(d){
  if(d.residualAmount <= 0) return {status:'done'};
  if(!d.monthlyPayment || d.monthlyPayment <= 0) return {status:'no-rate'};
  const months = d.residualAmount / d.monthlyPayment;
  return {status:'ok', months, date: addMonthsISO(todayISO(), months)};
}
function totalDebtsResidual(){ return state.debts.reduce((s,d)=> s + (d.residualAmount||0), 0); }
function totalDebtsMonthly(){ return state.debts.reduce((s,d)=> s + (d.monthlyPayment||0), 0); }
function netWorth(){ return totalPatrimonio() + totalAssetsValue() - totalDebtsResidual(); }

/* Insight automatici */
function computeInsights(){
  const insights = [];
  const income = monthlyIncomeTotal();
  const expenses = monthlyExpensesTotal();
  const avail = monthlyAvailable();

  if(income > 0){
    const savingsRate = (income - expenses) / income * 100;
    if(savingsRate >= 20){
      insights.push({type:'positive', icon:'check', text:`Stai risparmiando circa il ${savingsRate.toFixed(0)}% delle entrate mensili: un ottimo ritmo.`});
    } else if(savingsRate >= 0){
      insights.push({type:'info', icon:'target', text:`Risparmi circa il ${savingsRate.toFixed(0)}% delle entrate. Portarlo verso il 20% renderebbe i tuoi obiettivi più solidi.`});
    } else {
      insights.push({type:'warning', icon:'alert', text:`Le spese superano le entrate del ${Math.abs(savingsRate).toFixed(0)}%: stai intaccando i risparmi ogni mese.`});
    }
    const expenseRatio = expenses / income * 100;
    if(expenseRatio >= 70){
      insights.push({type:'warning', icon:'expenses', text:`Le spese fisse assorbono il ${expenseRatio.toFixed(0)}% delle entrate mensili.`});
    }
  }

  if(avail < 0){
    insights.push({type:'warning', icon:'alert', text:`Il disponibile mensile è negativo (${fmtEUR(avail)}): fondi e spese insieme superano le entrate.`});
  }

  state.funds.forEach(f=>{
    if(!f.goal) return;
    const pct = f.currentAmount / f.goal * 100;
    if(pct >= 100){
      insights.push({type:'positive', icon:'check', text:`"${escapeHTML(f.name)}" ha raggiunto il suo obiettivo.`});
    } else if(pct >= 90){
      insights.push({type:'positive', icon:'target', text:`"${escapeHTML(f.name)}" è al ${pct.toFixed(0)}% dell'obiettivo: quasi fatta.`});
    }
  });

  const stalledFunds = state.funds.filter(f=> f.goal && (!f.monthlyContribution || f.monthlyContribution<=0) && f.currentAmount < f.goal);
  if(stalledFunds.length){
    insights.push({type:'warning', icon:'funds', text:`${stalledFunds.length} fondo/i con obiettivo non hanno un versamento mensile impostato.`});
  }

  const offTrack = state.funds.filter(f=>{
    if(!f.goal || !f.targetDate) return false;
    const rec = fundRecommended(f);
    return rec.status==='ok' && (rec.amount - (f.monthlyContribution||0)) > 1;
  });
  if(offTrack.length){
    insights.push({type:'warning', icon:'target', text:`${offTrack.length} fondo/i rischiano di non centrare la data obiettivo al ritmo di versamento attuale.`});
  }

  if(state.debts.length){
    const noPayment = state.debts.filter(d=> d.residualAmount>0 && (!d.monthlyPayment || d.monthlyPayment<=0));
    if(noPayment.length){
      insights.push({type:'warning', icon:'debts', text:`${noPayment.length} debito/i senza una rata mensile impostata: non è possibile stimarne l'estinzione.`});
    }
  }

  const byCat = expensesByCategory();
  if(byCat.length && expenses>0){
    const top = byCat[0];
    const topPct = top.monthly / expenses * 100;
    if(topPct >= 40){
      insights.push({type:'info', icon:'expenses', text:`"${top.cat.label}" da sola pesa il ${topPct.toFixed(0)}% delle tue spese mensili.`});
    }
  }

  if(!insights.length){
    insights.push({type:'info', icon:'target', text:'Aggiungi entrate, spese e fondi per iniziare a vedere qui i tuoi insight personalizzati.'});
  }

  return insights.slice(0, 6);
}

let chartRefs = {};
function destroyChart(key){ if(chartRefs[key]){ chartRefs[key].destroy(); delete chartRefs[key]; } }

function aggregatedHistory(){
  const dateSet = new Set();
  state.accounts.forEach(a=> a.entries.forEach(e=> dateSet.add(e.date)));
  const dates = [...dateSet].sort();
  if(!dates.length) return {labels:[], values:[]};
  const values = dates.map(d=>{
    let total = 0;
    state.accounts.forEach(a=>{
      const es = sortedEntries(a).filter(e=> e.date<=d);
      if(es.length) total += es[es.length-1].amount;
    });
    return total;
  });
  return {labels:dates, values};
}

function emptyStateHTML(iconKey,title,desc,cta){
  return `<div class="empty-state" style="grid-column:1/-1;">
    ${ICONS[iconKey]}
    <div class="t">${title}</div>
    <div class="d">${desc}</div>
    <button class="btn btn-primary btn-sm" data-goto="${iconKey}">${ICONS.plus}${cta}</button>
  </div>`;
}

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hexAlpha(hex,a){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function baseChartOptions(empty){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => fmtEUR(ctx.parsed.y) } } },
    scales:{
      x:{ grid:{display:false}, ticks:{ color:cssVar('--ink-faint'), font:{family:'IBM Plex Sans', size:11} } },
      y:{ grid:{color:cssVar('--border-soft')}, ticks:{ color:cssVar('--ink-faint'), font:{family:'IBM Plex Mono', size:10.5}, callback:v=>fmtEUR(v) } }
    },
    interaction:{ intersect:false, mode:'index' }
  };
}

function accountCardHTML(acc){
  const ti = accountTypeInfo(acc.type);
  const bal = lastBalance(acc);
  const prev = prevBalance(acc);
  let deltaHTML = '<span class="acct-delta" style="color:var(--ink-faint);">Nessuno storico</span>';
  if(prev !== null){
    const diff = bal - prev;
    const cls = diff>=0 ? 'up':'down';
    deltaHTML = `<span class="acct-delta ${cls}">${ICONS[diff>=0?'up':'down']} ${fmtEUR(Math.abs(diff))} dal saldo precedente</span>`;
  }
  let returnHTML = '';
  if(acc.type==='invest' && acc.returnValue!=null){
    const cls = acc.returnValue>=0 ? 'up':'down';
    returnHTML = `<div class="acct-delta ${cls}" style="margin-top:4px;">${ICONS[acc.returnValue>=0?'up':'down']} Rendimento: ${formatReturn(acc)}</div>`;
  }
  return `
  <div class="acct-card" data-acc="${acc.id}">
    <div class="acct-stripe" style="background:${acc.color}"></div>
    <div class="acct-actions">
      <button class="iconOnly" data-edit-acc="${acc.id}" title="Modifica">${ICONS.edit}</button>
      <button class="iconOnly" data-del-acc="${acc.id}" title="Elimina">${ICONS.trash}</button>
    </div>
    <div class="acct-body">
      <div class="acct-top">
        <div class="acct-icon" style="background:${acc.color}">${ICONS[ti.icon]}</div>
        <div>
          <div class="acct-name">${escapeHTML(acc.name)}</div>
          <div class="acct-type">${ti.label}${acc.type==='deposito' && acc.rate ? ' · '+acc.rate.toLocaleString('it-IT')+'%/anno' : ''}</div>
        </div>
      </div>
      <div class="acct-bal mono">${fmtEUR(bal)}</div>
      ${deltaHTML}
      ${returnHTML}
    </div>
  </div>`;
}

function bindAccountCardEvents(container){
  container.querySelectorAll('[data-acc]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-edit-acc]') || e.target.closest('[data-del-acc]')) return;
      openAccountDetail(card.dataset.acc);
    });
  });
  container.querySelectorAll('[data-edit-acc]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); openAccountForm(b.dataset.editAcc); }));
  container.querySelectorAll('[data-del-acc]').forEach(b=> b.addEventListener('click', (e)=>{
    e.stopPropagation();
    confirmDialog('Eliminare questo conto?','Lo storico dei saldi andrà perso definitivamente.', ()=>{
      state.accounts = state.accounts.filter(a=> a.id!==b.dataset.delAcc);
      saveState(); renderAll(); showToast('Conto eliminato.');
    });
  }));
}

function openAccountForm(id){
  const editing = !!id;
  const acc = editing ? state.accounts.find(a=>a.id===id) : null;
  const body = `
    <div class="field"><label>Nome del conto</label>
      <input type="text" id="fAccName" placeholder="Es. Conto corrente principale" value="${acc?escapeAttr(acc.name):''}">
    </div>
    <div class="field"><label>Tipo</label>
      <select id="fAccType">${ACCOUNT_TYPES.map(t=>`<option value="${t.id}" ${acc&&acc.type===t.id?'selected':''}>${t.label}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Colore</label>
      <div class="swatches" id="fAccColor">
        ${ACCOUNT_TYPES.map(t=>t.color).concat(FUND_COLORS).filter((v,i,a)=>a.indexOf(v)===i).map(c=>`<div class="swatch ${(acc?acc.color:ACCOUNT_TYPES[0].color)===c?'selected':''}" data-color="${c}" style="background:${c}"></div>`).join('')}
      </div>
    </div>
    <div class="field-row" id="fDepositFields" style="display:none;">
      <div class="field"><label>Tasso netto previsto (%/anno)</label><input type="number" step="0.01" id="fAccRate" placeholder="Es. 3,20" value="${acc&&acc.rate!=null?acc.rate:''}"></div>
      <div class="field"><label>Scadenza/vincolo (opzionale)</label><input type="date" id="fAccMaturity" value="${acc&&acc.maturity?acc.maturity:''}"></div>
    </div>
    <div class="field-row" id="fInvestFields" style="display:none;">
      <div class="field"><label>Rendimento ottenuto finora</label><input type="number" step="0.01" id="fAccReturnValue" placeholder="Es. 8,5" value="${acc&&acc.returnValue!=null?acc.returnValue:''}"></div>
      <div class="field"><label>Formato</label>
        <select id="fAccReturnType">
          <option value="percent" ${!acc||acc.returnType!=='amount'?'selected':''}>Percentuale (%)</option>
          <option value="amount" ${acc&&acc.returnType==='amount'?'selected':''}>Importo (€)</option>
        </select>
      </div>
    </div>
    ${editing?'':`
    <div class="field-row">
      <div class="field"><label>Saldo attuale</label><input type="number" step="0.01" id="fAccAmount" placeholder="0,00" value=""></div>
      <div class="field"><label>Data</label><input type="date" id="fAccDate" value="${todayISO()}"></div>
    </div>`}
  `;
  openModal({
    title: editing ? 'Modifica conto' : 'Nuovo conto',
    body,
    confirmLabel: editing ? 'Salva modifiche' : 'Crea conto',
    onConfirm: ()=>{
      const name = document.getElementById('fAccName').value.trim();
      const type = document.getElementById('fAccType').value;
      const colorEl = document.querySelector('#fAccColor .swatch.selected');
      const color = colorEl ? colorEl.dataset.color : ACCOUNT_TYPES[0].color;
      if(!name){ showToast('Inserisci un nome per il conto.'); return false; }
      const isDeposit = type==='deposito';
      const rate = isDeposit ? (parseFloat(document.getElementById('fAccRate').value) || null) : null;
      const maturity = isDeposit ? (document.getElementById('fAccMaturity').value || null) : null;
      const isInvest = type==='invest';
      const returnValue = isInvest ? (parseFloat(document.getElementById('fAccReturnValue').value)) : null;
      const returnType = isInvest ? document.getElementById('fAccReturnType').value : null;
      if(editing){
        acc.name=name; acc.type=type; acc.color=color; acc.rate=rate; acc.maturity=maturity;
        acc.returnValue = (isInvest && !isNaN(returnValue)) ? returnValue : null;
        acc.returnType = returnType;
        if(type==='invest' && !acc.allocations) acc.allocations = [];
      } else {
        const amountRaw = document.getElementById('fAccAmount').value;
        const amount = amountRaw==='' ? 0 : parseFloat(amountRaw);
        const date = document.getElementById('fAccDate').value || todayISO();
        state.accounts.push({ id:uid(), name, type, color, entries:[{id:uid(), date, amount}], allocations: type==='invest'?[]:[], rate, maturity, returnValue: (isInvest && !isNaN(returnValue)) ? returnValue : null, returnType });
      }
      saveState(); renderAll(); showToast(editing?'Conto aggiornato.':'Conto creato.');
    }
  });
  document.getElementById('fAccColor').addEventListener('click', e=>{
    const sw = e.target.closest('.swatch'); if(!sw) return;
    document.querySelectorAll('#fAccColor .swatch').forEach(s=>s.classList.remove('selected'));
    sw.classList.add('selected');
  });
  const typeSel = document.getElementById('fAccType');
  const depositFields = document.getElementById('fDepositFields');
  const investFields = document.getElementById('fInvestFields');
  const syncType = ()=>{
    depositFields.style.display = typeSel.value==='deposito' ? 'grid' : 'none';
    investFields.style.display = typeSel.value==='invest' ? 'grid' : 'none';
  };
  typeSel.addEventListener('change', syncType); syncType();
}

function openAccountDetail(id){
  const acc = state.accounts.find(a=>a.id===id);
  if(!acc) return;
  const entries = sortedEntries(acc).reverse();

  let depositBlock = '';
  if(acc.type === 'deposito'){
    const est = estimateMaturityValue(acc);
    depositBlock = `
    <div class="field">
      <label>Dettagli del vincolo</label>
      <div class="deposit-stats">
        <div class="deposit-stat"><div class="lbl">Tasso netto previsto</div><div class="val">${acc.rate!=null?acc.rate.toLocaleString('it-IT')+'%/anno':'—'}</div></div>
        <div class="deposit-stat"><div class="lbl">Scadenza/vincolo</div><div class="val" style="font-size:13.5px;">${acc.maturity?fmtDate(acc.maturity):'Nessuna'}</div></div>
        ${est!=null?`<div class="deposit-stat"><div class="lbl">Valore stimato a scadenza</div><div class="val" style="color:var(--accent);">${fmtEUR(est)}</div></div>`:''}
      </div>
    </div>
    <hr class="section-divider">`;
  }

  let allocBlock = '';
  if(acc.type === 'invest'){
    const ret = formatReturn(acc);
    const retColor = acc.returnValue==null ? 'var(--ink-faint)' : (acc.returnValue>=0 ? 'var(--accent)' : 'var(--danger)');
    allocBlock = `
    <hr class="section-divider">
    <div class="field">
      <label>Performance</label>
      <div class="deposit-stats">
        <div class="deposit-stat"><div class="lbl">Rendimento ottenuto finora</div><div class="val" style="color:${retColor};">${ret || 'Non impostato'}</div></div>
      </div>
    </div>
    <div class="field">
      <label>Distribuzione del capitale</label>
      <div id="allocBar" class="alloc-bar"></div>
      <div id="allocList" class="alloc-list"></div>
      <div class="field-row" style="margin-top:8px;">
        <input type="text" id="fAllocName" placeholder="Es. MSCI World">
        <input type="number" step="0.01" id="fAllocAmount" placeholder="Importo">
      </div>
      <button class="btn btn-ghost btn-sm" id="btnAddAlloc" style="margin-top:8px;">${ICONS.plus} Aggiungi / aggiorna posizione</button>
      <div class="hint" id="allocHint"></div>
    </div>`;
  }

  const body = `
    <div class="chart-wrap" style="margin-bottom:16px;"><canvas id="chartAcc"></canvas></div>
    ${depositBlock}
    <div class="field">
      <label>Aggiungi un saldo per data</label>
      <div class="field-row">
        <input type="number" step="0.01" id="fEntryAmount" placeholder="Importo">
        <input type="date" id="fEntryDate" value="${todayISO()}">
      </div>
      <button class="btn btn-ghost btn-sm" id="btnAddEntry" style="margin-top:8px;">${ICONS.plus} Aggiungi</button>
      <div class="hint">Se esiste già un saldo per quella data, verrà sostituito.</div>
    </div>
    <div class="field">
      <label>Storico saldi</label>
      <div class="entry-list" id="entryList">
        ${entries.length ? entries.map(e=>`
          <div class="entry-row">
            <span class="d">${fmtDate(e.date)}</span>
            <span class="a mono">${fmtEUR(e.amount)}</span>
            <button class="iconOnly" data-del-entry="${e.id}" style="border:0;">${ICONS.trash}</button>
          </div>`).join('') : '<div style="padding:14px;font-size:13px;color:var(--ink-faint);">Nessun dato ancora.</div>'}
      </div>
    </div>
    ${allocBlock}
  `;
  openModal({
    title: acc.name, wide:true, hideConfirm:true, extraClose:true,
    body
  });
  document.getElementById('btnAddEntry').addEventListener('click', ()=>{
    const amount = parseFloat(document.getElementById('fEntryAmount').value);
    const date = document.getElementById('fEntryDate').value || todayISO();
    if(isNaN(amount)){ showToast('Inserisci un importo valido.'); return; }
    const existing = acc.entries.find(e=> e.date===date);
    if(existing) existing.amount = amount; else acc.entries.push({id:uid(), date, amount});
    saveState();
    openAccountDetail(id);
    renderAll();
  });
  document.querySelectorAll('[data-del-entry]').forEach(b=> b.addEventListener('click', ()=>{
    acc.entries = acc.entries.filter(e=> e.id!==b.dataset.delEntry);
    saveState(); openAccountDetail(id); renderAll();
  }));
  const es = sortedEntries(acc);
  destroyChart('acc');
  chartRefs.acc = new Chart(document.getElementById('chartAcc'), {
    type:'line',
    data:{ labels: es.map(e=>fmtDateShort(e.date)), datasets:[{
      data: es.map(e=>e.amount), borderColor: acc.color, backgroundColor: hexAlpha(acc.color,.14),
      fill:true, tension:.3, pointRadius:es.length>1?3:5, pointBackgroundColor:acc.color, borderWidth:2.4
    }]},
    options: baseChartOptions(es.length===0)
  });

  if(acc.type === 'invest'){
    renderAllocations(acc);
    document.getElementById('btnAddAlloc').addEventListener('click', ()=>{
      const name = document.getElementById('fAllocName').value.trim();
      const amount = parseFloat(document.getElementById('fAllocAmount').value);
      if(!name || isNaN(amount)){ showToast('Inserisci nome e importo della posizione.'); return; }
      if(!acc.allocations) acc.allocations = [];
      const existing = acc.allocations.find(a=> a.name.toLowerCase()===name.toLowerCase());
      if(existing) existing.amount = amount; else acc.allocations.push({id:uid(), name, amount});
      saveState(); renderAllocations(acc); renderAll();
      document.getElementById('fAllocName').value=''; document.getElementById('fAllocAmount').value='';
    });
  }
}

function renderAllocations(acc){
  const allocs = acc.allocations || [];
  const total = allocationTotal(acc);
  const bal = lastBalance(acc);
  document.getElementById('allocBar').innerHTML = allocs.length ? allocs.map((a,i)=>{
    const pct = total>0 ? (a.amount/total*100) : 0;
    return `<div class="alloc-seg" style="width:${pct}%;background:${ALLOC_PALETTE[i%ALLOC_PALETTE.length]}" title="${escapeAttr(a.name)}: ${fmtEUR(a.amount)}"></div>`;
  }).join('') : '';
  document.getElementById('allocList').innerHTML = allocs.length ? allocs.map((a,i)=>{
    const pct = total>0 ? Math.round(a.amount/total*100) : 0;
    return `<div class="alloc-row">
      <span class="dot" style="background:${ALLOC_PALETTE[i%ALLOC_PALETTE.length]}"></span>
      <span class="n">${escapeHTML(a.name)}</span>
      <span class="p">${pct}%</span>
      <span class="a mono">${fmtEUR(a.amount)}</span>
      <button class="iconOnly" data-del-alloc="${a.id}" style="border:0;">${ICONS.trash}</button>
    </div>`;
  }).join('') : '<div style="padding:8px 2px;font-size:12.5px;color:var(--ink-faint);">Nessuna posizione inserita ancora.</div>';
  const hintEl = document.getElementById('allocHint');
  if(allocs.length){
    const diff = bal - total;
    if(Math.abs(diff) < 0.01){
      hintEl.textContent = 'La distribuzione corrisponde al saldo attuale del conto.';
      hintEl.className = 'hint accent';
    } else {
      hintEl.textContent = `La distribuzione (${fmtEUR(total)}) ${diff>0?'è inferiore al saldo di':'supera il saldo di'} ${fmtEUR(Math.abs(diff))}.`;
      hintEl.className = 'hint danger';
    }
  } else hintEl.textContent = '';
  document.getElementById('allocList').querySelectorAll('[data-del-alloc]').forEach(b=> b.addEventListener('click', ()=>{
    acc.allocations = acc.allocations.filter(a=> a.id!==b.dataset.delAlloc);
    saveState(); renderAllocations(acc); renderAll();
  }));
}

        </select>
      </div>
    </div>
    <div class="hint" id="fExpMonthlyHint" style="margin-top:-6px;"></div>

    onConfirm: ()=>{
      const category = document.getElementById('fExpCategory').value;
      const name = document.getElementById('fExpName').value.trim();
      const amount = parseFloat(document.getElementById('fExpAmount').value);
      const frequency = document.getElementById('fExpFreq').value;
      const customInterval = Math.max(1, parseInt(document.getElementById('fExpCustomInterval').value)||1);
      const customUnit = document.getElementById('fExpCustomUnit').value;
      if(isNaN(amount) || amount<0){ showToast('Inserisci un importo valido.'); return false; }
      const data = {category, name, amount, frequency, customInterval, customUnit};

      else state.expenses.push({id:uid(), ...data, createdAt:todayISO()});
      saveState(); renderAll(); showToast(editing?'Spesa aggiornata.':'Spesa aggiunta.');
    }

  const customFields = document.getElementById('fExpCustomFields');

  const intervalEl = document.getElementById('fExpCustomInterval');
  const unitEl = document.getElementById('fExpCustomUnit');
  const hintEl = document.getElementById('fExpMonthlyHint');
  function syncAndPreview(){
    customFields.style.display = freqSel.value==='custom' ? 'grid' : 'none';
    const amount = parseFloat(amountEl.value);
    if(isNaN(amount)){ hintEl.textContent=''; return; }
    const preview = expenseMonthlyEquivalent({amount, frequency:freqSel.value, customInterval: parseInt(intervalEl.value)||1, customUnit: unitEl.value});
    hintEl.textContent = `Equivale a circa ${fmtEUR(preview)} al mese.`;
  }
  [freqSel, amountEl, intervalEl, unitEl].forEach(el=> el.addEventListener('input', syncAndPreview));
  freqSel.addEventListener('change', syncAndPreview);
  syncAndPreview();
}

function fundProjectionHTML(f){
  if(!f.goal) return '';
  const proj = fundProjection(f);
  const rec = fundRecommended(f);
  const lines = [];
  if(proj.status==='done'){
    lines.push(`<div class="fund-proj-line done">${ICONS.check} Obiettivo raggiunto</div>`);
  } else if(proj.status==='no-rate'){
    lines.push(`<div class="fund-proj-line muted">Imposta un versamento mensile per stimare la data di raggiungimento.</div>`);
  } else {
    lines.push(`<div class="fund-proj-line">${ICONS.target} Al ritmo attuale: raggiunto entro <b>${fmtDate(proj.date)}</b></div>`);
  }
  if(f.targetDate && proj.status!=='done'){
    if(rec.status==='overdue'){
      lines.push(`<div class="fund-proj-line danger">La data obiettivo (${fmtDate(f.targetDate)}) è già superata.</div>`);
    } else if(rec.status==='ok'){
      const current = f.monthlyContribution||0;
      const short = rec.amount - current;
      const cmp = short > 0.5
        ? `<span class="tag-bad">mancano ${fmtEUR(short)}/mese</span>`
        : `<span class="tag-ok">sei in linea</span>`;
      lines.push(`<div class="fund-proj-line">Per il ${fmtDate(f.targetDate)}, versa <b>${fmtEUR(rec.amount)}</b>/mese — ${cmp}</div>`);
    }
  }
  return `<div class="fund-proj">${lines.join('')}</div>`;
}

function fundCardHTML(f){
  const pct = f.goal ? Math.min(100, Math.round((f.currentAmount/f.goal)*100)) : null;
  const ringStyle = pct!==null ? `background: conic-gradient(${f.color} ${pct*3.6}deg, var(--border) 0deg);` : `background:${f.color};`;
  return `
  <div class="fund-card" data-fund="${f.id}">
    <div class="fund-top">
      <div class="fund-icon" style="background:${f.color}">${ICONS[f.icon]||ICONS.other}</div>
      <div>
        <div class="fund-name">${escapeHTML(f.name)}</div>
        <div class="fund-note">${f.goal?('Obiettivo: '+fmtEUR(f.goal)):'Fondo aperto, senza obiettivo'}</div>
      </div>
    </div>
    <div class="fund-mid">
      <div class="ring" style="${ringStyle}"><div class="hole"><span class="pct">${pct!==null?pct+'%':'—'}</span></div></div>
      <div class="fund-figs">
        <div class="amt mono">${fmtEUR(f.currentAmount)}</div>
        ${f.goal?`<div class="goal">su ${fmtEUR(f.goal)}</div>`:'<div class="goal">accantonato finora</div>'}
      </div>
    </div>
    ${fundProjectionHTML(f)}
    <div class="fund-bottom">
      <div class="fund-monthly">Versamento: <b>${fmtEUR(f.monthlyContribution||0)}</b>/mese</div>
      <div class="fund-actions">
        <button class="btn btn-ghost btn-sm" data-move-fund="${f.id}">Movimento</button>
        <button class="iconOnly" data-edit-fund="${f.id}">${ICONS.edit}</button>
        <button class="iconOnly" data-del-fund="${f.id}">${ICONS.trash}</button>
      </div>
    </div>
  </div>`;
}

function openFundForm(id){
  const editing = !!id;
  const f = editing ? state.funds.find(x=>x.id===id) : null;
  const body = `
    <div class="field"><label>Nome del fondo</label><input type="text" id="fFundName" placeholder="Es. Fondo emergenza" value="${f?escapeAttr(f.name):''}"></div>
    <div class="field"><label>Icona</label>
      <div class="icon-picker" id="fFundIcon">
        ${FUND_ICON_KEYS.map(k=>`<div class="icon-opt ${ (f?f.icon:'shield')===k?'selected':''}" data-icon="${k}">${ICONS[k]}</div>`).join('')}
      </div>
    </div>
    <div class="field"><label>Colore</label>
      <div class="swatches" id="fFundColor">
        ${FUND_COLORS.map(c=>`<div class="swatch ${(f?f.color:FUND_COLORS[0])===c?'selected':''}" data-color="${c}" style="background:${c}"></div>`).join('')}
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>${editing?'Importo attuale':'Importo iniziale'}</label><input type="number" step="0.01" id="fFundAmount" placeholder="0,00" value="${f?f.currentAmount:''}"></div>
      <div class="field"><label>Versamento mensile</label><input type="number" step="0.01" id="fFundMonthly" placeholder="0,00" value="${f?f.monthlyContribution:''}"></div>
    </div>
    <div class="chk-row"><input type="checkbox" id="fFundHasGoal" ${!f || f.goal ? 'checked':''}> Ha un obiettivo di importo</div>
    <div id="fFundGoalWrap">
      <div class="field"><label>Obiettivo da raggiungere</label><input type="number" step="0.01" id="fFundGoal" placeholder="0,00" value="${f&&f.goal?f.goal:''}"></div>
      <div class="field"><label>Data obiettivo (opzionale)</label><input type="date" id="fFundTargetDate" value="${f&&f.targetDate?f.targetDate:''}"></div>
      <div class="hint" id="fFundRecHint" style="margin-top:-8px;margin-bottom:14px;"></div>
    </div>
    <div class="hint" style="margin-top:-6px;">L'importo iniziale viene considerato "allocato" all'interno del tuo patrimonio esistente: non è denaro aggiuntivo.</div>
  `;
  openModal({
    title: editing?'Modifica fondo':'Nuovo fondo', body, confirmLabel: editing?'Salva modifiche':'Crea fondo',
    onConfirm: ()=>{
      const name = document.getElementById('fFundName').value.trim();
      const icon = document.querySelector('#fFundIcon .icon-opt.selected')?.dataset.icon || 'shield';
      const color = document.querySelector('#fFundColor .swatch.selected')?.dataset.color || FUND_COLORS[0];
      const amount = parseFloat(document.getElementById('fFundAmount').value) || 0;
      const monthly = parseFloat(document.getElementById('fFundMonthly').value) || 0;
      const hasGoal = document.getElementById('fFundHasGoal').checked;
      const goalRaw = document.getElementById('fFundGoal').value;
      const goal = hasGoal && goalRaw!=='' ? parseFloat(goalRaw) : null;
      const targetDate = hasGoal ? (document.getElementById('fFundTargetDate').value || null) : null;
      if(!name){ showToast('Inserisci un nome per il fondo.'); return false; }
      if(editing){ Object.assign(f,{name,icon,color,currentAmount:amount,monthlyContribution:monthly,goal,targetDate}); }
      else state.funds.push({id:uid(), name, icon, color, currentAmount:amount, monthlyContribution:monthly, goal, targetDate, createdAt:todayISO()});
      saveState(); renderAll(); showToast(editing?'Fondo aggiornato.':'Fondo creato.');
    }
  });
  document.getElementById('fFundIcon').addEventListener('click', e=>{
    const opt = e.target.closest('.icon-opt'); if(!opt) return;
    document.querySelectorAll('#fFundIcon .icon-opt').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
  });
  document.getElementById('fFundColor').addEventListener('click', e=>{
    const sw = e.target.closest('.swatch'); if(!sw) return;
    document.querySelectorAll('#fFundColor .swatch').forEach(s=>s.classList.remove('selected'));
    sw.classList.add('selected');
  });
  const goalWrap = document.getElementById('fFundGoalWrap');
  const chk = document.getElementById('fFundHasGoal');
  const syncGoal = ()=> goalWrap.style.display = chk.checked ? 'block' : 'none';
  chk.addEventListener('change', ()=>{ syncGoal(); updateFundRecHint(); }); syncGoal();

  const amountEl = document.getElementById('fFundAmount');
  const goalEl = document.getElementById('fFundGoal');
  const targetEl = document.getElementById('fFundTargetDate');
  function updateFundRecHint(){
    const hintEl = document.getElementById('fFundRecHint');
    const amount = parseFloat(amountEl.value) || 0;
    const goal = parseFloat(goalEl.value) || 0;
    const targetDate = targetEl.value;
    if(!chk.checked || !goal || !targetDate){ hintEl.textContent=''; hintEl.className='hint'; return; }
    const remaining = goal - amount;
    if(remaining <= 0){ hintEl.textContent = "Obiettivo già raggiunto con l'importo attuale."; hintEl.className='hint accent'; return; }
    const months = monthsBetweenISO(todayISO(), targetDate);
    if(months <= 0.03){ hintEl.textContent = 'La data scelta è già passata o è troppo vicina.'; hintEl.className='hint danger'; return; }
    hintEl.textContent = `Per raggiungere l'obiettivo entro questa data dovresti versare circa ${fmtEUR(remaining/months)}/mese.`;
    hintEl.className = 'hint';
  }
  [amountEl, goalEl, targetEl].forEach(el=> el.addEventListener('input', updateFundRecHint));
  updateFundRecHint();
}

function openFundMovement(id){
  const f = state.funds.find(x=>x.id===id);
  if(!f) return;
  const body = `
    <p style="font-size:13px;color:var(--ink-soft);margin-top:0;">Importo attuale: <b class="mono">${fmtEUR(f.currentAmount)}</b></p>

      <select id="fMoveType"><option value="deposit">Versamento (+)</option><option value="withdraw">Prelievo (-)</option></select>
    </div>
    <div class="field"><label>Importo</label><input type="number" step="0.01" id="fMoveAmount" placeholder="0,00"></div>
  `;
  openModal({
    title:'Movimento fondo — ' + f.name, body, confirmLabel:'Conferma',
    onConfirm:()=>{
      const type = document.getElementById('fMoveType').value;
      const amount = parseFloat(document.getElementById('fMoveAmount').value);

  });

function debtProjectionHTML(d){
  const proj = debtProjection(d);
  if(proj.status==='done'){
    return `<div class="fund-proj"><div class="fund-proj-line done">${ICONS.check} Debito estinto</div></div>`;
  }
  if(proj.status==='no-rate'){
    return `<div class="fund-proj"><div class="fund-proj-line muted">Imposta una rata mensile per stimare l'estinzione.</div></div>`;
  }
  return `<div class="fund-proj"><div class="fund-proj-line">${ICONS.target} Al ritmo attuale: estinto entro <b>${fmtDate(proj.date)}</b></div></div>`;
}

    <div class="fund-mid">
      <div class="ring" style="${ringStyle}"><div class="hole"><span class="pct">${pctPaid!==null?pctPaid+'%':'—'}</span></div></div>
      <div class="fund-figs">
        <div class="amt mono">${fmtEUR(d.residualAmount)}</div>
        ${d.originalAmount?`<div class="goal">residuo su ${fmtEUR(d.originalAmount)}</div>`:'<div class="goal">saldo residuo</div>'}
